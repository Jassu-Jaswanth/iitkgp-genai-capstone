# Serves the built React app and forwards /api/* to the backend.
# Rate limiting: each client IP may ask 10 questions a minute (burst 5); reads are looser.
limit_req_zone $binary_remote_addr zone=ask:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=read:10m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    root /usr/share/nginx/html;

    location = /api/agent {
        limit_req zone=ask burst=5 nodelay;
        proxy_pass http://backend:8100/agent;
        proxy_read_timeout 600s;            # the shared model answers one request at a time
    }
    location = /api/chat {
        limit_req zone=ask burst=5 nodelay;
        proxy_pass http://backend:8100/chat;
        proxy_read_timeout 600s;
    }
    location /api/ {
        limit_req zone=read burst=40 nodelay;
        proxy_pass http://backend:8100/;
    }
    location / {
        try_files $uri /index.html;
    }
}
