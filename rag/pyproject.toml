[project]
name = "hr-navigator-rag"
version = "0.1.0"
description = "RAG service for the HR Policy Navigator: curation, chunking, hybrid BM25 + dense retrieval, reranking"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "fastembed>=0.4",
    "tokenizers>=0.19",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "huggingface-hub>=1.33.0",
    "arize-phoenix-otel>=0.17",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
