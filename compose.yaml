# docker compose up --build   ->  three containers, nothing else:
#
#   postgres   chat history, the trace of every answer, agent memory, answer cache   (127.0.0.1:5433)
#   backend    LangGraph agent + tools; searches the policy corpus in-process (rag/retriever.py)   (:8100)
#   frontend   React app (nginx): chat with a live trace panel, traces, evaluation; rate-limits /api   (:3000)
#
# Open http://localhost:3000. First start embeds the corpus into data/index (~2 min); later starts reuse it.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hrnav
      POSTGRES_USER: hrnav
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrnav-local}   # local only; the port is bound to 127.0.0.1
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["127.0.0.1:5433:5432"]                             # for psql / running the backend outside docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrnav -d hrnav"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: {context: ., dockerfile: backend/Dockerfile, args: {RAG_EXTRA: rag}}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hrnav:${POSTGRES_PASSWORD:-hrnav-local}@postgres:5432/hrnav
      RETRIEVAL_MODE: inprocess                                # search runs inside the backend; no RAG container
    volumes:
      - ./.env:/app/.env:ro
      - ./.context/certs:/app/.context/certs:ro
      - ./data:/app/data                                       # writable: builds data/index on first start if missing
      - ./eval/results:/app/eval/results:ro                    # eval reports shown on the Evaluation page
    ports: ["8100:8100"]                                       # the eval runner talks to the backend directly
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8100/health',timeout=5)"]
      interval: 15s
      start_period: 300s                                       # first start may embed the corpus (~2 min)
      timeout: 10s
      retries: 3

  frontend:
    build: {context: ., dockerfile: frontend/Dockerfile}
    ports: ["3000:80"]
    depends_on:
      backend: {condition: service_healthy}

volumes:
  pgdata:
