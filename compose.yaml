# docker compose up --build   -> backend + chat dashboard (:8501) + trace dashboard (Phoenix, :6006)
#                                 retrieval is a placeholder until RAG_SERVICE_URL points at the RAG service
services:
  phoenix:
    image: arizephoenix/phoenix:latest
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_ENABLE_AUTH: "false"   # local dev only; ports are bound to 127.0.0.1 below
    volumes:
      - phoenix-data:/mnt/data
    ports: ["127.0.0.1:6006:6006"]
    healthcheck:   # image has no shell/curl; python is there
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:6006/healthz',timeout=5)"]
      interval: 5s
      timeout: 5s
      retries: 24

  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: .env
    environment:
      RAG_SERVICE_URL: ${RAG_SERVICE_URL:-}
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
    volumes:
      - ./.env:/app/.env:ro
      - ./.context/certs:/app/.context/certs:ro
      - ./data:/app/data:ro
    ports: ["8100:8100"]
    depends_on:
      phoenix: {condition: service_healthy}  # otherwise early traces are dropped while Phoenix migrates
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8100/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  frontend:
    build: {context: ., dockerfile: frontend/Dockerfile}
    environment:
      API_URL: http://backend:8100
      TRACES_UI_URL: http://localhost:6006
    volumes:
      - ./eval/results:/app/eval/results:ro
    ports: ["8501:8501"]
    depends_on:
      backend: {condition: service_healthy}

volumes:
  phoenix-data:
