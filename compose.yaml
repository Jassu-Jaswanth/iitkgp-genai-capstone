# docker compose up --build   -> one dashboard on :8501 (chat + traces + evals) over the backend (:8100, RAG in-process)
#                                 Phoenix runs headless: it stores traces, the dashboard reads them via its API
#                                 retrieval is a placeholder until RAG_SERVICE_URL points at the RAG service
services:
  phoenix:
    image: arizephoenix/phoenix:latest
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_ENABLE_AUTH: "false"   # only reachable inside the compose network (no published port)
    volumes:
      - phoenix-data:/mnt/data
    # ports: ["127.0.0.1:6006:6006"]   # uncomment to open Phoenix's own UI for deep debugging
    healthcheck:   # image has no shell/curl; python is there
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:6006/healthz',timeout=5)"]
      interval: 5s
      timeout: 5s
      retries: 24

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args: {RAG_EXTRA: rag}   # retrieval runs inside the backend; set "" for a slim placeholder/http image
    env_file: .env
    environment:
      RAG_MODE: ${RAG_MODE:-inprocess}
      RAG_SERVICE_URL: ${RAG_SERVICE_URL:-}
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
    volumes:
      - ./.env:/app/.env:ro
      - ./.context/certs:/app/.context/certs:ro
      - ./data:/app/data   # writable: builds data/index on first start if the FAISS cache is missing
    ports: ["8100:8100"]
    depends_on:
      phoenix: {condition: service_healthy}  # otherwise early traces are dropped while Phoenix migrates
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8100/health',timeout=5)"]
      interval: 30s
      start_period: 120s   # in-process RAG loads the index + reranker at startup
      timeout: 10s
      retries: 3
  frontend:
    build: {context: ., dockerfile: frontend/Dockerfile}
    environment:
      API_URL: http://backend:8100
      PHOENIX_URL: http://phoenix:6006
    volumes:
      - ./eval/results:/app/eval/results:ro
    ports: ["8501:8501"]
    depends_on:
      backend: {condition: service_healthy}

volumes:
  phoenix-data:
